name: Find deals

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run.py
        env:
          JUMIA_AFFILIATE_ID: ${{ secrets.JUMIA_AFFILIATE_ID }}
          KONGA_AFFILIATE_ID: ${{ secrets.KONGA_AFFILIATE_ID }}
          SLOT_AFFILIATE_ID: ${{ secrets.SLOT_AFFILIATE_ID }}
          KARA_AFFILIATE_ID: ${{ secrets.KARA_AFFILIATE_ID }}
      - name: Add travel deals
        run: python travel_deals.py
        continue-on-error: true
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
      - name: Save results
        run: |
          git config user.name "promo-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/deals.json
          git diff --cached --quiet || git commit -m "Update deals"
          git push
